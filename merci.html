<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex, follow">
  <title>Merci pour ton partage | Au cœur d’elle</title>
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
  <link rel="icon" type="image/png" sizes="48x48" href="assets/favicon-48.png">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    :root{--navy:#29496b;--mauve:#a98fae;--ink:#34465a;--soft:#788393;--line:rgba(65,80,105,.13)}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:flex;flex-direction:column;background:linear-gradient(180deg,#fff,#f8f7fb 60%,#fff);color:var(--ink);font-family:"DM Sans",sans-serif;font-weight:300}
    .shell{width:min(900px,calc(100% - 40px));margin:auto}
    header{padding:25px 0;border-bottom:1px solid var(--line)}
    .brand{text-decoration:none;display:inline-flex;flex-direction:column;gap:4px;color:inherit}
    .brand strong{font:500 1.22rem/1 "Cormorant Garamond",serif;letter-spacing:.12em;color:var(--navy)}
    .brand span{font-size:.62rem;letter-spacing:.08em;color:var(--soft)}
    main{flex:1;display:grid;place-items:center;text-align:center;padding:70px 0}
    .card{max-width:680px;padding:54px 42px;border:1px solid var(--line);border-radius:26px;background:rgba(255,255,255,.86);box-shadow:0 20px 60px rgba(50,65,90,.06)}
    .crystal{margin-bottom:18px}.crystal img{display:block;width:58px;height:58px;margin:0 auto}
    h1{margin:0 0 18px;font:500 clamp(2.5rem,6vw,4.2rem)/1 "Cormorant Garamond",serif;color:var(--navy)}
    p{max-width:560px;margin:0 auto 28px;line-height:1.75;color:var(--soft)}
    a.button{display:inline-block;padding:13px 23px;border-radius:999px;background:var(--navy);color:#fff;text-decoration:none;text-transform:uppercase;font-size:.7rem;letter-spacing:.08em;font-weight:500}
    footer{text-align:center;border-top:1px solid var(--line);padding:24px;font-size:.68rem;color:#858195}
    @media(max-width:600px){.card{padding:40px 22px}}
  </style>

<style>
:root{--ink:#1E334C!important;--ink-soft:#5E6676!important;--lav:#8F7589!important;--lav-2:#D9D5D6!important;--lav-3:#F5ECF0!important;--pearl:#FCFAF7!important;--blush:#F6EEF1!important;--ice:#A4ADBC!important;--line:rgba(31,46,74,.12)!important}
body{background:#FCFAF7!important;color:#1E334C!important}
.btn,.button,button[type="submit"]{border-radius:999px!important}
</style>

<style id="v93-warm-cream-palette">
/* V93 — palette plus chaude : crème à la place des gris, Hero conservé */
:root{
  --cream:#F8F2EB;
  --cream-light:#FCF8F4;
  --navy:#1E334C;
  --mist:#A8B5C4;
  --mauve-warm:#A47C93;
  --rose-warm:#D9B8C4;
}
body{background:var(--cream-light)}
/* Le Hero V89/V92 reste volontairement inchangé */
.global-approach{background:var(--cream-light)!important}
.pathways{background:var(--cream)!important}
.pathway-self{background:#F6EEE7!important}
.pathway-essence{background:#F9F3EE!important}
.pathway{border:1px solid rgba(164,124,147,.16);box-shadow:0 16px 38px rgba(30,51,76,.055)}
.pathway-num,.eyebrow{color:var(--mauve-warm)!important}
.pathway-kicker{color:#8D667E!important}
.for-you{background:var(--cream-light)!important}
.for-you-card-blue{background:#EEF0F1!important}
.for-you-card-rose{background:#F2DFE4!important}
.for-you-card-mauve{background:#E5D5DE!important}
.story{background:var(--cream-light)!important}
.diamond-card{background:#F4EAE6!important;border-color:rgba(164,124,147,.16)!important}
.offers{background:var(--cream)!important}
.offer{background:#FFFCF9!important}
.portfolio{background:var(--cream-light)!important}
.project-testimonial{background:#F4EAE6!important}
.device-scene{background:#E7E8E8!important}
.final{background:#B5B6BE!important}
.site-footer{background:var(--navy)!important}
</style>

<style id="v94-harmony-pass">
/* V94 — harmonisation fidèle à la maquette chaude : crème + bleu nuit + mauve signature */
:root{
  --navy:#1E334C;
  --navy-soft:#405069;
  --mauve:#A36F8A;
  --mauve-deep:#8C5875;
  --mauve-soft:#D9BBC8;
  --rose-mist:#EAD8DE;
  --blue-mist:#A8B8C8;
  --cream:#F8F0E8;
  --cream-light:#FDF9F5;
  --cream-deep:#F1E4D9;
  --warm-line:rgba(163,111,138,.26);
}
body{background:var(--cream-light)!important;color:var(--navy)!important}

/* Navigation : même ancrage que la maquette */
.brand-name,.links a{color:var(--navy)!important}
.brand-sub{color:#75677A!important}
.links a::after{background:var(--mauve)!important}
.nav-cta{
  background:var(--mauve)!important;color:#fff!important;border-color:transparent!important;
  border-radius:999px!important;box-shadow:0 10px 24px rgba(140,88,117,.18)!important;
}

/* Boutons : le mauve devient une vraie couleur signature */
.btn{border-radius:999px!important;padding:15px 24px!important}
.btn-primary{
  background:var(--mauve)!important;color:#fff!important;
  box-shadow:0 12px 26px rgba(140,88,117,.20)!important;
}
.btn-primary:hover{background:var(--mauve-deep)!important;box-shadow:0 16px 32px rgba(140,88,117,.25)!important}
.btn-secondary{background:transparent!important;color:var(--navy)!important;border:1px solid var(--mauve)!important}

/* Hiérarchie colorée */
.eyebrow,.section-kicker,.offers-kicker,.offer-num,.project-number{color:var(--mauve)!important}
h1,h2,h3{color:var(--navy)}
.global-approach h2 em,.story-copy h2 em,.welcome h2 em,.signature,.project-copy h3,.offer h3{color:var(--mauve)!important}
.hero-rule,.hero-welcome{color:var(--mauve)!important}
.hero-rule::before,.hero-rule::after{background:var(--mauve)!important}
.hero-rule i{background:var(--mauve-soft)!important}

/* Fonds crème : suppression de l'impression grise */
.global-approach,.for-you,.story,.portfolio,.home-breath{background:var(--cream-light)!important}
.pathways,.offers{background:var(--cream)!important}
.pathway-self,.pathway-essence,.offer,.diamond-card,.project-testimonial{background:var(--cream-light)!important}
.pathway,.offer,.diamond-card{border-color:var(--warm-line)!important}

/* Les deux portes : distinctes mais dans la même famille */
.pathway{box-shadow:0 18px 42px rgba(30,51,76,.07)!important}
.pathway-self{border-top:3px solid var(--navy)!important}
.pathway-essence{border-top:3px solid var(--mauve)!important}
.pathway-self h3{color:var(--navy)!important}
.pathway-essence h3{color:var(--mauve-deep)!important}
.pathway-kicker{color:#7F6073!important}
.pathway-content a{
  display:inline-flex!important;align-items:center!important;justify-content:center!important;align-self:flex-start!important;
  border-radius:999px!important;padding:13px 19px!important;letter-spacing:.11em!important;text-decoration:none!important;
}
.pathway-self .pathway-content a{background:var(--navy)!important;color:#fff!important}
.pathway-essence .pathway-content a{background:var(--mauve)!important;color:#fff!important}

/* Pour toi si : plus chaud, sans gris froid */
.for-you-card-blue{background:#E6EAF0!important}
.for-you-card-rose{background:var(--rose-mist)!important}
.for-you-card-mauve{background:#E2CFD8!important}
.for-you-symbol{color:var(--mauve-deep)!important}

/* Cartes / témoignages / détails */
.diamond-card{background:#F6ECE7!important}
.project-testimonial{background:#F6ECE7!important;border-left-color:var(--mauve-soft)!important}
.testimonial-mark,.testimonial-initial,.project-link,.more{color:var(--mauve)!important}
.project-block{border-top-color:var(--warm-line)!important}

/* Les aperçus restent frais mais moins gris */
.device-scene{background:linear-gradient(145deg,#EEF1F3 0%,#F8F4F1 55%,#E4E8EC 100%)!important}

/* CTA final : mauve profond, comme la maquette */
.final{
  background:linear-gradient(120deg,#A77890 0%,#93647D 52%,#7E536B 100%)!important;
}
.final::before{background:linear-gradient(90deg,rgba(255,255,255,.05),rgba(255,255,255,.12))!important}
.final h2,.final .eyebrow{color:#fff!important}
.final-paths .btn-primary{background:#fff!important;color:var(--mauve-deep)!important;box-shadow:none!important}
.final-paths .btn-secondary{background:transparent!important;color:#fff!important;border-color:rgba(255,255,255,.65)!important}

.site-footer{background:var(--navy)!important;color:#fff!important}
.footer-name{color:#fff!important}.footer-sub,.footer-links a,.footer-bottom{color:rgba(255,255,255,.68)!important}
.footer-bottom{border-top-color:rgba(255,255,255,.14)!important}

@media(max-width:760px){
  .pathway-content a{align-self:stretch!important}
}
</style>


<style id="v138-mobile-responsive">
html,body{max-width:100%;overflow-x:hidden}
@media(max-width:560px){.shell{width:calc(100% - 30px)!important}input,textarea,select,button{font-size:16px}.btn,button{min-height:44px;max-width:100%;white-space:normal;text-align:center}}
</style>
</head>
<body>
<header><div class="shell"><a class="brand" href="index.html"><strong>AU CŒUR D’ELLE</strong><span>Identité de marque et communication digitale</span></a></div></header>
<main class="shell">
  <section class="card">
    <div class="crystal"><img src="assets/favicon-au-coeur-delle.png" alt="" aria-hidden="true"></div>
    <h1>Merci pour ton partage.</h1>
    <p>J’ai bien reçu ton projet. Je prendrai le temps de découvrir ton univers et ce que tu souhaites créer avant de revenir vers toi.</p>
    <a class="button" href="index.html">Revenir à l’accueil</a>
  </section>
</main>
<footer>© 2026 Jenny Moreau-Sonko · Au cœur d’elle</footer>
</body>
</html>
